openapi: 3.1.0
info:
  title: FlashFlow API
  version: 1.0.0
  description: 高并发限量购与订单履约平台的外部 API
servers:
  - url: http://localhost:8080
    description: Local gateway
tags:
  - name: Auth
  - name: Products
  - name: Campaigns
  - name: Addresses
  - name: Orders
  - name: AfterSales
  - name: Reviews
  - name: Admin
paths:
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: JWT issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponseEnvelope"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/products:
    get:
      tags: [Products]
      operationId: listProducts
      parameters:
        - {name: keyword, in: query, schema: {type: string}}
        - {name: categoryId, in: query, schema: {type: integer, format: int64}}
      responses:
        "200":
          description: Active products
  /api/v1/campaigns:
    get:
      tags: [Campaigns]
      operationId: listCampaigns
      parameters:
        - {name: keyword, in: query, schema: {type: string}}
        - {name: categoryId, in: query, schema: {type: integer, format: int64}}
      responses:
        "200":
          description: Active campaigns
    post:
      tags: [Campaigns]
      operationId: createCampaign
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCampaignRequest"
      responses:
        "200":
          description: Campaign created
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/campaigns/{campaignId}/orders:
    post:
      tags: [Orders]
      operationId: placeOrder
      security:
        - bearerAuth: []
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{8,64}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceOrderRequest"
      responses:
        "200":
          description: Order created or idempotently replayed
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /api/v1/addresses:
    get:
      tags: [Addresses]
      operationId: listAddresses
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Current user's shipping addresses}
    post:
      tags: [Addresses]
      operationId: createAddress
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SaveAddressRequest"}
      responses:
        "200": {description: Shipping address created}
  /api/v1/addresses/{addressId}:
    put:
      tags: [Addresses]
      operationId: updateAddress
      security: [{bearerAuth: []}]
      parameters:
        - {name: addressId, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SaveAddressRequest"}
      responses:
        "200": {description: Shipping address updated}
        "404": {$ref: "#/components/responses/Error"}
    delete:
      tags: [Addresses]
      operationId: deleteAddress
      security: [{bearerAuth: []}]
      parameters:
        - {name: addressId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        "200": {description: Shipping address deleted}
  /api/v1/addresses/{addressId}/default:
    patch:
      tags: [Addresses]
      operationId: setDefaultAddress
      security: [{bearerAuth: []}]
      parameters:
        - {name: addressId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        "200": {description: Default address changed}
  /api/v1/orders:
    get:
      tags: [Orders]
      operationId: listMyOrders
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user's latest orders
  /api/v1/orders/{orderNo}:
    get:
      tags: [Orders]
      operationId: getOrder
      security:
        - bearerAuth: []
      parameters:
        - name: orderNo
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order detail
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/orders/{orderNo}/pay:
    post:
      tags: [Orders]
      operationId: payOrder
      security:
        - bearerAuth: []
      parameters:
        - name: orderNo
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Payment state transition completed
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/orders/{orderNo}/receive:
    post:
      tags: [Orders]
      operationId: confirmReceipt
      security: [{bearerAuth: []}]
      parameters:
        - {name: orderNo, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Owner confirmed order receipt}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/orders/{orderNo}/cancel:
    post:
      tags: [AfterSales]
      operationId: cancelOrder
      security: [{bearerAuth: []}]
      parameters:
        - {name: orderNo, in: path, required: true, schema: {type: string}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: string, maxLength: 500}
      responses:
        "200": {description: Pending order cancelled and stock restored}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/orders/{orderNo}/returns:
    post:
      tags: [AfterSales]
      operationId: createReturn
      security: [{bearerAuth: []}]
      parameters:
        - {name: orderNo, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 5, maxLength: 500}
      responses:
        "200": {description: Return request created}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/returns:
    get:
      tags: [AfterSales]
      operationId: listMyReturns
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Current user's return requests}
  /api/v1/orders/{orderNo}/reviews:
    post:
      tags: [Reviews]
      operationId: createPurchasedReview
      security: [{bearerAuth: []}]
      parameters:
        - {name: orderNo, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating, content]
              properties:
                rating: {type: integer, minimum: 1, maximum: 5}
                content: {type: string, minLength: 3, maxLength: 1000}
      responses:
        "200": {description: Verified-purchase review created}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/products/{productId}/reviews:
    get:
      tags: [Reviews]
      operationId: listVisibleProductReviews
      parameters:
        - {name: productId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        "200": {description: Visible reviews with masked reviewer names}
  /api/v1/admin/orders:
    get:
      tags: [Admin]
      operationId: listAdminOrders
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Recent orders across all users}
  /api/v1/admin/orders/{orderNo}/ship:
    post:
      tags: [Admin]
      operationId: shipOrder
      security: [{bearerAuth: []}]
      parameters:
        - {name: orderNo, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [carrier, trackingNo]
              properties:
                carrier: {type: string, maxLength: 80}
                trackingNo: {type: string, maxLength: 80}
      responses:
        "200": {description: Paid order shipped}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/admin/returns:
    get:
      tags: [Admin]
      operationId: listAdminReturns
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Return workbench}
  /api/v1/admin/returns/{returnId}/decision:
    patch:
      tags: [Admin]
      operationId: decideReturn
      security: [{bearerAuth: []}]
      parameters:
        - {name: returnId, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approved]
              properties:
                approved: {type: boolean}
                note: {type: string, maxLength: 500}
      responses:
        "200": {description: Return approved or rejected}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/admin/reviews:
    get:
      tags: [Admin]
      operationId: listAdminReviews
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Reviews including real usernames and hidden records}
  /api/v1/admin/reviews/{reviewId}/visibility:
    patch:
      tags: [Admin]
      operationId: changeReviewVisibility
      security: [{bearerAuth: []}]
      parameters:
        - {name: reviewId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        "200": {description: Review visibility changed}
  /api/v1/admin/reviews/{reviewId}/reply:
    patch:
      tags: [Admin]
      operationId: replyReview
      security: [{bearerAuth: []}]
      parameters:
        - {name: reviewId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        "200": {description: Merchant reply saved}
  /api/v1/admin/variants/{variantId}/price:
    patch:
      tags: [Admin]
      operationId: changeVariantPrice
      security: [{bearerAuth: []}]
      parameters:
        - {name: variantId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        "200": {description: SKU list price changed}
  /api/v1/admin/inventory/reconciliation:
    get:
      tags: [Inventory]
      operationId: inspectStockReconciliation
      summary: Read-only comparison of Redis stock and MySQL stock for active campaigns
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Per-campaign stock state; never changes Redis
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReconciliationReportEnvelope"}
    post:
      tags: [Inventory]
      operationId: runStockReconciliation
      summary: Run one reconciliation pass now
      description: >
        Drift is only repaired when the same Redis value and campaign row version have been
        observed for a whole quiet window; the repair is a Lua compare-and-set.
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Report after this pass, including repaired campaigns
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReconciliationReportEnvelope"}
  /api/v1/admin/inventory/reconciliation/logs:
    get:
      tags: [Inventory]
      operationId: listStockRepairs
      summary: Latest 50 audited Redis stock repairs
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Repair audit records with Redis value before and after}
  /api/v1/admin/inventory/compensations:
    get:
      tags: [Inventory]
      operationId: listStockCompensations
      summary: Latest 100 durable Redis compensation tasks
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Compensation tasks with status, outcome and last error}
  /api/v1/admin/inventory/compensations/{taskId}/retry:
    post:
      tags: [Inventory]
      operationId: retryStockCompensation
      summary: Reset a FAILED compensation task and run it immediately
      security: [{bearerAuth: []}]
      parameters:
        - {name: taskId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        "200": {description: Task after the retry attempt}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Error:
      description: Standard error envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    TokenResponseEnvelope:
      type: object
      properties:
        code:
          type: string
          const: OK
        data:
          type: object
          properties:
            accessToken:
              type: string
            tokenType:
              type: string
              const: Bearer
            expiresInSeconds:
              type: integer
              format: int64
            role:
              type: string
    CreateCampaignRequest:
      type: object
      required: [productId, flashPrice, totalStock, startsAt, endsAt]
      properties:
        productId:
          type: integer
          format: int64
        flashPrice:
          type: number
        totalStock:
          type: integer
          minimum: 1
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
    PlaceOrderRequest:
      type: object
      required: [quantity, addressId]
      properties:
        quantity: {type: integer, minimum: 1}
        addressId: {type: integer, format: int64}
    SaveAddressRequest:
      type: object
      required: [recipientName, phone, province, city, district, detailAddress]
      properties:
        recipientName: {type: string, maxLength: 80}
        phone: {type: string, maxLength: 32}
        province: {type: string, maxLength: 80}
        city: {type: string, maxLength: 80}
        district: {type: string, maxLength: 80}
        detailAddress: {type: string, maxLength: 255}
        postalCode: {type: string, maxLength: 20}
        defaultAddress: {type: boolean, default: false}
    ReconciliationReportEnvelope:
      type: object
      properties:
        code: {type: string, const: OK}
        data:
          type: object
          properties:
            checkedAt: {type: string, format: date-time}
            quietWindowSeconds: {type: integer, format: int64}
            campaigns: {type: integer}
            consistent: {type: integer}
            drifting: {type: integer}
            repaired: {type: integer}
            items:
              type: array
              items:
                type: object
                properties:
                  campaignId: {type: integer, format: int64}
                  totalStock: {type: integer}
                  databaseStock: {type: integer}
                  redisStock: {type: [integer, "null"]}
                  drift: {type: [integer, "null"], description: Redis minus MySQL}
                  pendingCompensations: {type: integer, format: int64}
                  state:
                    type: string
                    enum: [CONSISTENT, DRIFT_OBSERVED, REPAIRED, PENDING_COMPENSATION, CAS_CONFLICT, MISSING_KEY]
    ErrorEnvelope:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        traceId:
          type: string
