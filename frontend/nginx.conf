server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    location /api/ {
        proxy_pass http://gateway-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /notification-api {
        proxy_pass http://notification-service:8082/internal/notifications;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /platform-health/gateway {
        proxy_pass http://gateway-service:8080/actuator/health;
        proxy_http_version 1.1;
    }

    location = /platform-health/trade {
        proxy_pass http://trade-service:8081/actuator/health;
        proxy_http_version 1.1;
    }

    location = /platform-health/notification {
        proxy_pass http://notification-service:8082/actuator/health;
        proxy_http_version 1.1;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
