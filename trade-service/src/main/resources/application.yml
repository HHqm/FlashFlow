server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

spring:
  application:
    name: trade-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/flashflow_trade?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&rewriteBatchedStatements=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true&useLocalSessionState=true&cacheServerConfiguration=true&cacheResultSetMetadata=true&maintainTimeStats=false}
    username: ${MYSQL_USER:flashflow}
    password: ${MYSQL_PASSWORD:flashflow_app}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:20}
      connection-timeout: 3000
      validation-timeout: 1000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 100
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:flashflow_redis}
      timeout: 2s
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    admin:
      fail-fast: false
    producer:
      acks: all
      retries: 10
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
        linger.ms: 5
        batch.size: 65536
        compression.type: lz4
  jackson:
    time-zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 20s

security:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-at-least-32-bytes}
    ttl-minutes: ${JWT_TTL_MINUTES:120}

flashflow:
  demo-data-enabled: ${DEMO_DATA_ENABLED:true}
  seckill:
    requests-per-second: ${SECKILL_REQUESTS_PER_SECOND:5}
  order:
    payment-timeout: ${PAYMENT_TIMEOUT:PT15M}
    campaign-cache-ttl: ${ORDER_CAMPAIGN_CACHE_TTL:PT1S}
    snapshot-cache-ttl: ${ORDER_SNAPSHOT_CACHE_TTL:PT5M}
    write-stripes: ${ORDER_WRITE_STRIPES:4}
    # Stock rows per new campaign; each bucket is committed by its own write stripe.
    stock-buckets: ${ORDER_STOCK_BUCKETS:4}
    write-queue-capacity: ${ORDER_WRITE_QUEUE_CAPACITY:2048}
    write-batch-size: ${ORDER_WRITE_BATCH_SIZE:64}
    write-batch-window: ${ORDER_WRITE_BATCH_WINDOW:PT0.008S}
  kafka:
    order-events-topic: ${ORDER_EVENTS_TOPIC:flashflow.order-events.v1}
    partitions: ${ORDER_EVENTS_PARTITIONS:6}
  outbox:
    # POLLING: scheduled publisher; CDC: Debezium reads the binlog (see compose.cdc.yml)
    mode: ${OUTBOX_MODE:POLLING}
    max-retries: ${OUTBOX_MAX_RETRIES:10}
    batch-size: ${OUTBOX_BATCH_SIZE:500}
    send-timeout: ${OUTBOX_SEND_TIMEOUT:PT5S}
    retention: ${OUTBOX_RETENTION:P7D}
    cleanup-chunk-size: ${OUTBOX_CLEANUP_CHUNK_SIZE:2000}
    cleanup-max-chunks: ${OUTBOX_CLEANUP_MAX_CHUNKS:20}
  stock-compensation:
    retry-grace-period: ${STOCK_COMPENSATION_RETRY_GRACE_PERIOD:PT10S}
    max-retries: ${STOCK_COMPENSATION_MAX_RETRIES:12}
    batch-size: ${STOCK_COMPENSATION_BATCH_SIZE:100}
  stock-reconciliation:
    quiet-window: ${STOCK_RECONCILIATION_QUIET_WINDOW:PT30S}
  jobs:
    outbox-enabled: ${OUTBOX_JOB_ENABLED:true}
    outbox-delay-ms: ${OUTBOX_JOB_DELAY_MS:100}
    order-timeout-enabled: ${ORDER_TIMEOUT_JOB_ENABLED:true}
    order-timeout-delay-ms: ${ORDER_TIMEOUT_JOB_DELAY_MS:30000}
    outbox-cleanup-enabled: ${OUTBOX_CLEANUP_JOB_ENABLED:true}
    outbox-cleanup-delay-ms: ${OUTBOX_CLEANUP_JOB_DELAY_MS:60000}
    stock-compensation-enabled: ${STOCK_COMPENSATION_JOB_ENABLED:true}
    stock-compensation-delay-ms: ${STOCK_COMPENSATION_JOB_DELAY_MS:5000}
    stock-reconciliation-enabled: ${STOCK_RECONCILIATION_JOB_ENABLED:true}
    stock-reconciliation-delay-ms: ${STOCK_RECONCILIATION_JOB_DELAY_MS:15000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    org.hibernate.SQL: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [traceId=%X{traceId:-}] %logger{36} - %msg%n"
