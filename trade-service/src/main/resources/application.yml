server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

spring:
  application:
    name: trade-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/flashflow_trade?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&rewriteBatchedStatements=true}
    username: ${MYSQL_USER:flashflow}
    password: ${MYSQL_PASSWORD:flashflow_app}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 3000
      validation-timeout: 1000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:flashflow_redis}
      timeout: 2s
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    admin:
      fail-fast: false
    producer:
      acks: all
      retries: 10
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
  jackson:
    time-zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 20s

security:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-at-least-32-bytes}
    ttl-minutes: ${JWT_TTL_MINUTES:120}

flashflow:
  demo-data-enabled: ${DEMO_DATA_ENABLED:true}
  seckill:
    requests-per-second: ${SECKILL_REQUESTS_PER_SECOND:5}
  order:
    payment-timeout: ${PAYMENT_TIMEOUT:PT15M}
  kafka:
    order-events-topic: ${ORDER_EVENTS_TOPIC:flashflow.order-events.v1}
    partitions: ${ORDER_EVENTS_PARTITIONS:6}
  outbox:
    max-retries: ${OUTBOX_MAX_RETRIES:10}
  jobs:
    outbox-enabled: ${OUTBOX_JOB_ENABLED:true}
    outbox-delay-ms: ${OUTBOX_JOB_DELAY_MS:1000}
    order-timeout-enabled: ${ORDER_TIMEOUT_JOB_ENABLED:true}
    order-timeout-delay-ms: ${ORDER_TIMEOUT_JOB_DELAY_MS:30000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    org.hibernate.SQL: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [traceId=%X{traceId:-}] %logger{36} - %msg%n"
